name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-and-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # PHPUnit uses sqlite :memory: (see phpunit.xml) and seeds what it needs itself.
      - name: PHP tests
        run: php artisan test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Store unit tests
        run: npm run test:unit

      # Playwright hits a real server, so it needs the seeded DB plus reference data
      # (characters / HSK words, e.g. /char/学). Source files are cached between runs.
      - name: Prepare database for Playwright
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force

      - name: Cache reference data sources
        uses: actions/cache@v4
        with:
          path: database/sources
          key: reference-sources-v1-${{ hashFiles('app/Console/Commands/ImportReferenceData.php') }}

      - name: Import reference data
        run: php artisan hsk:import-reference

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
